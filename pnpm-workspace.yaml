overrides:
  deepmerge-ts: '>=8.0.0'
  fastify: ^5.12.5
  ws@>=8.0.0 <8.21.0: ^8.21.3
  find-my-way@<9.6.1: ^9.7.0
  js-yaml@>=5.0.0 <5.4.1: ^5.4.1
  js-yaml@>=3.0.0 <4.0.0: ^3.15.2
  js-yaml@>=4.0.0 <5.0.0: ^4.3.2
  fast-uri: ^4.1.5
  qs: '>=6.16.0'
  mysql2: '>=3.24.4'
  multer: ^2.4.0
  hono: ^4.13.7
  '@hono/node-server': ^1.19.15
  lodash: ^4.17.24
  valibot: ^1.4.2
  '@fastify/busboy': ^3.2.2
  source-map-js: ^1.2.2
  proxy-addr: ^2.0.8
  brace-expansion@<1.1.21: ^1.1.21
  brace-expansion@>=2.0.0 <2.1.7: ^2.1.7
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12

allowBuilds:
  '@apollo/protobufjs': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@sentry/node-cpu-profiler': true
  '@swc/core': true
  bcrypt: true
  esbuild: true
  prisma: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - mysql2@3.24.4

# Can't be fixed by an override yet; see README "Known pnpm audit findings".
auditConfig:
  ignoreGhsas:
    - GHSA-7mx3-vvmw-hjmv # @graphql-tools/utils 11 (fix needs @nestjs/graphql 14)
    - GHSA-vfj7-8cjw-p6xm # braces 3.0.3 via @nestjs/apollo 13 (no fixed braces; gone with @nestjs/apollo 14)
    - GHSA-hp3w-g68c-fv3c # sprintf-js 1.0.3 via jest (no fixed version published, dev only)
